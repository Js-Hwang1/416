# Tigers reverse proxy — nginx does no routing of its own.
# Spring Boot at 127.0.0.1:8081 serves everything: /api/*, /tiles/*, the
# React build, and the SPA fallback. This file is committed to the repo
# and rsynced into place by the deploy workflow on every push.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/geo+json application/javascript application/octet-stream;
    gzip_proxied any;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 300s;
    }
}
