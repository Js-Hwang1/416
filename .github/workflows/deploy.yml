name: Deploy to DigitalOcean

on:
  push:
    branches: [Master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      REACT_APP_API_URL: http://${{ secrets.DROPLET_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('server/**/*.gradle*', 'server/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Spring Boot JAR
        working-directory: server
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon -q
          ls -lh build/libs/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build React client
        working-directory: client
        env:
          PUBLIC_URL: /
          CI: ''
        run: npm run build

      - name: Stage deploy bundle
        run: |
          mkdir -p deploy/app deploy/www
          cp server/build/libs/*.jar deploy/app/app.jar
          cp -R client/build/. deploy/www/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DROPLET_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync JAR
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            deploy/app/ "$DROPLET_USER@$DROPLET_HOST:/opt/tigers/app/"

      - name: Rsync client build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            deploy/www/ "$DROPLET_USER@$DROPLET_HOST:/var/www/tigers/"

      - name: Restart Spring Boot
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DROPLET_USER@$DROPLET_HOST" \
            "systemctl restart tigers && sleep 5 && systemctl is-active tigers"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$DROPLET_HOST/hello")
            if [ "$code" = "200" ]; then
              echo "Smoke test passed (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying..."
            sleep 3
          done
          echo "Smoke test failed"
          exit 1
