name: Deploy to DigitalOcean

on:
  push:
    branches: [Master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Normalize secrets
        env:
          RAW_HOST: ${{ secrets.DROPLET_HOST }}
          RAW_USER: ${{ secrets.DROPLET_USER }}
        run: |
          CLEAN_HOST=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')
          CLEAN_USER=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')
          echo "DROPLET_HOST=$CLEAN_HOST" >> $GITHUB_ENV
          echo "DROPLET_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "REACT_APP_API_URL=http://$CLEAN_HOST" >> $GITHUB_ENV
          echo "host raw=${#RAW_HOST} clean=${#CLEAN_HOST}"
          echo "user raw=${#RAW_USER} clean=${#CLEAN_USER}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('server/**/*.gradle*', 'server/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Spring Boot JAR
        working-directory: server
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon -q
          ls -lh build/libs/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build React client
        working-directory: client
        env:
          PUBLIC_URL: /
          CI: ''
        run: npm run build

      - name: Stage deploy bundle
        run: |
          mkdir -p deploy/app deploy/www
          cp server/build/libs/*.jar deploy/app/app.jar
          cp -R client/build/. deploy/www/

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Strip CRLF, ensure trailing newline (OpenSSH requires it)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Sanity: derive the public key fingerprint from the private key
          ssh-keygen -y -f ~/.ssh/deploy_key | awk '{print "deploy pubkey:", $1, substr($2,1,20)"..."}'
          ssh-keygen -lf ~/.ssh/deploy_key
          # Test connection (DROPLET_USER/DROPLET_HOST already normalized)
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            "$DROPLET_USER@$DROPLET_HOST" "echo connected as \$(whoami)@\$(hostname)"

      - name: Rsync JAR
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            deploy/app/ "$DROPLET_USER@$DROPLET_HOST:/opt/tigers/app/"

      - name: Rsync client build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            deploy/www/ "$DROPLET_USER@$DROPLET_HOST:/var/www/tigers/"

      - name: Restart Spring Boot
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DROPLET_USER@$DROPLET_HOST" \
            "systemctl restart tigers && sleep 5 && systemctl is-active tigers"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$DROPLET_HOST/hello")
            if [ "$code" = "200" ]; then
              echo "Smoke test passed (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying..."
            sleep 3
          done
          echo "Smoke test failed"
          exit 1
